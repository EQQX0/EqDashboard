<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samsung Server</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="login" hidden>
  <form id="loginForm" class="card login">
    <h1>Samsung Server</h1>
    <p class="muted">Sign in to your own server.</p>
    <label for="url">Server address</label>
    <input id="url" type="url" placeholder="https://api.example.com" autocomplete="off" required>
    <label for="token">Token</label>
    <input id="token" type="password" autocomplete="off" required>
    <p id="scanNote" class="muted">Looking for a pairing file in Downloads, Desktop and Documents. If one appears, you are signed in automatically.</p>
    <p id="loginErr" class="err" role="alert"></p>
    <button class="btn primary" type="submit">Sign in</button>
    <button class="btn" type="button" id="importBtn">Import pairing file</button>
  </form>
</section>

<div id="shell" hidden>
  <nav id="nav" aria-label="Sections"></nav>
  <main>
    <header>
      <h2 id="title"></h2>
      <span id="stamp" class="muted"></span>
      <button id="refresh" class="btn">Refresh</button>
    </header>
    <p id="banner" class="err" role="alert" hidden></p>
    <div id="view"></div>
  </main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
