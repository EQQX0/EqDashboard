<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samsung Server</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="login" hidden>
  <form id="loginForm" class="glass login" novalidate>
    <div class="logo" aria-hidden="true">S</div>
    <h1>Samsung Server</h1>
    <p class="sub">Sign in to your server agent</p>
    <div id="found" class="found" hidden>
      <p id="foundText"></p>
      <div class="toolbar">
        <button class="btn primary" type="button" id="useFound">Sign in with this file</button>
        <button class="btn" type="button" id="skipFound">Enter manually</button>
      </div>
      <p id="foundErr" class="err" role="alert"></p>
    </div>
    <div id="manual">
      <label for="url">Server URL</label>
      <input id="url" type="url" placeholder="https://api.example.com" autocomplete="off" required>
      <label for="token">Access token</label>
      <input id="token" type="password" autocomplete="off" required>
      <p id="loginErr" class="err" role="alert"></p>
      <button class="btn primary wide" type="submit">Sign in</button>
    </div>
    <button class="btn wide" type="button" id="importBtn">Import pairing file</button>
  </form>
</section>

<div id="shell" hidden>
  <header class="topbar">
    <div class="brand"><span class="logo" aria-hidden="true">S</span><span class="brand-name">Samsung Server</span></div>
    <nav id="nav" aria-label="Sections"></nav>
    <button id="signout" class="tab" type="button"></button>
  </header>
  <main>
    <div class="page-head">
      <div>
        <h1 id="title"></h1>
        <p id="subtitle" class="sub"></p>
      </div>
      <button id="refresh" class="btn light" type="button">Refresh</button>
    </div>
    <div class="chips"><span id="chip" class="chip"></span><span id="banner" class="chip bad" role="alert" hidden></span></div>
    <div id="view"></div>
  </main>
</div>
<div id="toasts" class="toasts" popover="manual" role="status" aria-live="polite" aria-atomic="false"></div>
<script src="toast-logic.js"></script>
<script src="sites-logic.js"></script>
<script src="manage-logic.js"></script>
<script src="trash-logic.js"></script>
<script src="app.js"></script>
</body>
</html>
